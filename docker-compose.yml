version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pragati-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://alvaspragati.com,https://www.alvaspragati.com,http://localhost:3000}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - pragati-network

networks:
  pragati-network:
    driver: bridge
